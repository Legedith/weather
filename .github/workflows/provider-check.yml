name: Check weather provider access
on:
  workflow_dispatch:
  push:
    branches: [fix/restore-retro-and-check-weathernext3]
    paths:
      - scripts/check_providers.py
      - .github/workflows/provider-check.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WEATHERNEXT_GOOGLE_CREDENTIALS: ${{ secrets.WEATHERNEXT_GOOGLE_CREDENTIALS }}
      GOOGLE_WEATHER_PROXY_URL: ${{ vars.GOOGLE_WEATHER_PROXY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authentication helper only when credentials were supplied
        if: env.WEATHERNEXT_GOOGLE_CREDENTIALS != ''
        run: python -m pip install 'google-auth[requests]==2.40.3'
      - name: Probe metadata and tiny hourly forecasts without exposing credentials
        run: python scripts/check_providers.py
      - uses: actions/upload-artifact@v4
        with:
          name: provider-access-report
          path: test-results/provider-access.json
